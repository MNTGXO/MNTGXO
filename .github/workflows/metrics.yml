name: Generate GitHub Metrics

on:
  schedule:
    # Runs every 7 hours
    - cron: "0 */7 * * *"
  workflow_dispatch:

# Never run two metrics jobs at once (avoids push conflicts)
concurrency:
  group: github-metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # 1) Top languages card -> github-metrics-languages.svg
      #    (built by scripts/top_languages.py; the metrics action produced an empty card)
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate top languages card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: mntgxo
          OUT_FILE: github-metrics-languages.svg
        run: python3 scripts/top_languages.py

      - name: Commit languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics-languages.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update top languages card"
            git pull --rebase
            git push
          fi

      # 2) General stats card -> github-metrics-stats.svg
      - name: General stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: mntgxo
          template: classic
          base: header, activity, community, repositories
          commits_limit: 0
          repositories_affiliations: owner, collaborator, organization_member
          config_timezone: Asia/Kolkata
          filename: github-metrics-stats.svg
